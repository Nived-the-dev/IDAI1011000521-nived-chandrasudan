# Force a readable light theme for the custom ParentConnect interface.
# Previously Streamlit could inherit a dark theme (white text)
# while app.py styled its backgrounds light, making text almost invisible.
[theme]
base = "light"
primaryColor = "#4934B8"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#152039"
font = "sans serif"
